name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # has prebuilt Pythons 3.10-3.14; ubuntu-latest (26.04) lacks older ones
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test the CLI
        run: astq "find class where name = 'DataProcessor'" examples/example.py
